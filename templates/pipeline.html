<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiro AI • Neural Workflow (n8n Real-Time Inspector)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            overflow: auto !important;
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .pipeline-app {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background-color: #090d16;
            background-image: radial-gradient(circle, #1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .wf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1.5rem;
            background-color: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1e293b;
            z-index: 20;
        }

        .wf-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wf-brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.4);
        }

        .wf-brand-titles {
            display: flex;
            flex-direction: column;
        }

        .wf-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }

        .wf-subtitle {
            font-size: 11px;
            color: #94a3b8;
        }

        .wf-test-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 4px 6px;
            width: 440px;
        }

        .wf-test-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 13px;
            padding: 6px 8px;
            outline: none;
        }

        .wf-test-input::placeholder {
            color: #64748b;
        }

        .wf-header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wf-status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 9999px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }

        .wf-status-badge.live {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .wf-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse-dot 2s infinite ease-in-out;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .wf-main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .wf-canvas {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        /* Inspector Drawer */
        .wf-inspector {
            width: 440px;
            background: #0f172a;
            border-left: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .insp-top {
            padding: 16px 20px;
            border-bottom: 1px solid #1e293b;
            background: #111827;
        }

        .insp-tag {
            font-size: 10px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .insp-title {
            font-size: 15px;
            font-weight: 700;
            color: #f8fafc;
            margin: 4px 0;
        }

        .insp-sub {
            font-size: 12px;
            color: #94a3b8;
        }

        .insp-tabs-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid #1e293b;
            background: #0b0f19;
        }

        .insp-tabs {
            display: flex;
            gap: 6px;
        }

        .insp-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .insp-btn.active {
            background: #1e293b;
            color: #f8fafc;
        }

        .insp-body {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }

        .insp-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #e2e8f0;
            background: #090d16;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="pipeline-app">
        <!-- Workflow Top Bar -->
        <header class="wf-header">
            <div class="wf-brand">
                <div class="wf-brand-icon">
                    <i class="ph ph-tree-structure"></i>
                </div>
                <div class="wf-brand-titles">
                    <span class="wf-title">SHIRO NEURAL WORKFLOW</span>
                    <span class="wf-subtitle">n8n Real-Time Execution Inspector</span>
                </div>
            </div>

            <!-- Quick Test Bar -->
            <form id="test-run-form" class="wf-test-bar" onsubmit="runTestQuery(event)">
                <input type="text" id="test-input" class="wf-test-input" placeholder="Ketik pesan uji coba untuk memicu neuron AI..." autocomplete="off">
                <button type="submit" id="test-submit-btn" class="btn-primary btn-sm" title="Jalankan Alur">
                    <i class="ph ph-play"></i> Eksekusi
                </button>
            </form>

            <div class="wf-header-actions">
                <div class="wf-status-badge live">
                    <span class="wf-status-dot"></span>
                    <span id="sse-status-text">Live Stream Aktif</span>
                </div>
                <div class="wf-status-badge">
                    <i class="ph ph-timer"></i>
                    <span id="total-time-badge">0 ms</span>
                </div>
                <a href="/" class="btn-secondary btn-sm" title="Kembali ke Web Chat Shiro">
                    <i class="ph ph-chat-circle-dots"></i> Kembali ke Chat
                </a>
            </div>
        </header>

        <!-- Main Workflow Canvas -->
        <div class="wf-main">
            <div class="wf-canvas">
                <div id="nodes-flow-container" class="flowchart-canvas" style="max-width: 920px; width: 100%;">
                    <!-- Populated dynamically via JavaScript -->
                </div>
            </div>

            <!-- Side Node Inspector -->
            <div class="wf-inspector">
                <div class="insp-top">
                    <span class="insp-tag">NODE TELEMETRY & DATA</span>
                    <h3 id="side-node-name" class="insp-title">Pilih Node</h3>
                    <p id="side-node-summary" class="insp-sub">Klik node mana saja di alur sebelah kiri untuk memeriksa payload input dan output secara terperinci.</p>
                </div>
                <div class="insp-tabs-bar">
                    <div class="insp-tabs">
                        <button type="button" class="insp-btn active" id="tab-out-btn" onclick="switchInspectorTab('output')">Data Output</button>
                        <button type="button" class="insp-btn" id="tab-in-btn" onclick="switchInspectorTab('input')">Data Input</button>
                    </div>
                    <button type="button" class="btn-secondary btn-sm" onclick="copyCurrentJson()" title="Salin Payload">
                        <i class="ph ph-copy"></i> Salin
                    </button>
                </div>
                <div class="insp-body">
                    <pre class="insp-code"><code id="side-code-view">// Menunggu eksekusi alur...</code></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTrace = null;
        let selectedNodeId = null;
        let activeTab = 'output';
        let simTimers = [];

        function clearSim() {
            simTimers.forEach(t => clearTimeout(t));
            simTimers = [];
        }

        function startSim(inputText) {
            clearSim();
            currentTrace = {
                total_duration_ms: 0,
                nodes: [
                    { id: "node_input", name: "Input Ingestion", type: "trigger", icon: "ph-chat-circle-dots", color: "#3b82f6", status: "running", duration_ms: 0, summary: "Menerima input query...", data_in: { message: inputText }, data_out: {} },
                    { id: "node_emotion", name: "Emotion & Tone Classifier", type: "analyzer", icon: "ph-heartbeat", color: "#ec4899", status: "idle", duration_ms: 0, summary: "Menunggu...", data_in: {}, data_out: {} },
                    { id: "node_memory", name: "Cognitive Memory & RDF Retrieval", type: "database", icon: "ph-brain", color: "#8b5cf6", status: "idle", duration_ms: 0, summary: "Menunggu...", data_in: {}, data_out: {} },
                    { id: "node_prompt", name: "Dynamic Prompt Synthesizer", type: "transform", icon: "ph-brackets-curly", color: "#06b6d4", status: "idle", duration_ms: 0, summary: "Menunggu...", data_in: {}, data_out: {} },
                    { id: "node_llm", name: "Neural Inference Engine", type: "ai_model", icon: "ph-cpu", color: "#f59e0b", status: "idle", duration_ms: 0, summary: "Menunggu...", data_in: {}, data_out: {} },
                    { id: "node_filter", name: "Anti-Hallucination & CoT Filter", type: "filter", icon: "ph-shield-check", color: "#10b981", status: "idle", duration_ms: 0, summary: "Menunggu...", data_in: {}, data_out: {} },
                    { id: "node_state", name: "State & Persistence Sync", type: "persistence", icon: "ph-database", color: "#6366f1", status: "idle", duration_ms: 0, summary: "Menunggu...", data_in: {}, data_out: {} },
                    { id: "node_output", name: "Response Delivery Stream", type: "output", icon: "ph-paper-plane-right", color: "#3b82f6", status: "idle", duration_ms: 0, summary: "Menunggu...", data_in: {}, data_out: {} }
                ]
            };
            renderWorkflow(currentTrace);

            simTimers.push(setTimeout(() => {
                if (!currentTrace || !currentTrace.nodes) return;
                currentTrace.nodes[0].status = 'success';
                currentTrace.nodes[0].duration_ms = 14;
                currentTrace.nodes[0].summary = `${(inputText || '').length} Karakter`;
                currentTrace.nodes[1].status = 'running';
                currentTrace.nodes[1].summary = 'Menganalisis emosi & tone...';
                renderWorkflow(currentTrace);
            }, 120));

            simTimers.push(setTimeout(() => {
                if (!currentTrace || !currentTrace.nodes) return;
                currentTrace.nodes[1].status = 'success';
                currentTrace.nodes[1].duration_ms = 10;
                currentTrace.nodes[1].summary = 'Emosi terklasifikasi';
                currentTrace.nodes[2].status = 'running';
                currentTrace.nodes[2].summary = 'Mengambil fakta RDF & memori...';
                renderWorkflow(currentTrace);
            }, 280));

            simTimers.push(setTimeout(() => {
                if (!currentTrace || !currentTrace.nodes) return;
                currentTrace.nodes[2].status = 'success';
                currentTrace.nodes[2].duration_ms = 28;
                currentTrace.nodes[2].summary = 'Memori & RDF dimuat';
                currentTrace.nodes[3].status = 'running';
                currentTrace.nodes[3].summary = 'Menyusun system prompt...';
                renderWorkflow(currentTrace);
            }, 480));

            simTimers.push(setTimeout(() => {
                if (!currentTrace || !currentTrace.nodes) return;
                currentTrace.nodes[3].status = 'success';
                currentTrace.nodes[3].duration_ms = 18;
                currentTrace.nodes[3].summary = 'Prompt tersintesis';
                currentTrace.nodes[4].status = 'running';
                currentTrace.nodes[4].summary = 'Sedang inferensi neural di GPU...';
                renderWorkflow(currentTrace);
            }, 700));
        }

        // Initialize SSE (Server-Sent Events) listener
        function initSSE() {
            const statusText = document.getElementById('sse-status-text');
            const evtSource = new EventSource('/api/pipeline/events');

            evtSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data && data.nodes) {
                        clearSim();
                        currentTrace = data;
                        renderWorkflow(data);
                    }
                } catch (e) {
                    console.error("Error parsing pipeline event:", e);
                }
            };

            evtSource.onerror = function() {
                statusText.textContent = "Reconnecting...";
            };

            evtSource.onopen = function() {
                statusText.textContent = "Live Stream Aktif";
            };
        }

        // Fetch latest trace on page load
        async function fetchLatestTrace() {
            try {
                const res = await fetch('/api/pipeline/latest');
                if (res.ok) {
                    const data = await res.json();
                    currentTrace = data;
                    renderWorkflow(data);
                }
            } catch (err) {
                console.error("Fetch latest pipeline error:", err);
            }
        }

        // Render nodes and connectors in 2-Stage Flowchart
        function renderWorkflow(trace) {
            const container = document.getElementById('nodes-flow-container');
            const totalTimeBadge = document.getElementById('total-time-badge');
            
            if (trace.total_duration_ms) {
                totalTimeBadge.textContent = `${Math.round(trace.total_duration_ms)} ms`;
            }

            if (!trace.nodes || trace.nodes.length === 0) return;

            const stage1Nodes = trace.nodes.slice(0, 4);
            const stage2Nodes = trace.nodes.slice(4, 8);

            const stage1Chips = ['pesan teks', 'tone emosi', 'fakta RDF'];
            const stage2Chips = ['raw token', '100% ID', 'sync memori'];

            const renderCard = (node, idx) => {
                const isSelected = selectedNodeId === node.id || (!selectedNodeId && idx === 0);
                if (isSelected && !selectedNodeId) selectedNodeId = node.id;

                const isRunning = node.status === 'running';
                const isSuccess = node.status === 'success';

                let badgeHtml = '';
                if (isRunning) {
                    badgeHtml = `<span class="flow-node-badge running"><i class="ph ph-spinner ph-spin"></i> Proses...</span>`;
                } else if (isSuccess) {
                    const dur = node.duration_ms ? `${Math.round(node.duration_ms)}ms` : '0ms';
                    badgeHtml = `<span class="flow-node-badge success">✓ ${dur}</span>`;
                } else {
                    badgeHtml = `<span class="flow-node-badge idle"><i class="ph ph-clock"></i> Tunggu</span>`;
                }

                return `
                    <div class="flow-node-card ${isSelected ? 'selected' : ''} ${node.status || ''}" onclick="selectNode('${node.id}')">
                        <div class="flow-node-top">
                            <div class="flow-node-icon" style="background: ${node.color || '#3b82f6'};">
                                <i class="ph ${node.icon || 'ph-gear'}"></i>
                            </div>
                            ${badgeHtml}
                        </div>
                        <div class="flow-node-title" title="${node.name}">${node.name}</div>
                        <div class="flow-node-summary">${node.summary || ''}</div>
                    </div>
                `;
            };

            const renderArrow = (active, chip) => {
                return `
                    <div class="flow-arrow-track ${active ? 'active' : ''}">
                        <div class="flow-arrow-line">
                            ${active ? '<div class="flow-pulse-beam"></div>' : ''}
                        </div>
                        <div class="flow-run-chip" title="${chip}">${chip}</div>
                    </div>
                `;
            };

            const stage1Ms = stage1Nodes.reduce((acc, n) => acc + (n.duration_ms || 0), 0);
            const stage2Ms = stage2Nodes.reduce((acc, n) => acc + (n.duration_ms || 0), 0);
            const stage1Done = stage1Nodes.every(n => n.status === 'success');

            let html = `
                <div class="flow-stage-bar">
                    <span class="flow-stage-label"><i class="ph ph-lightning"></i> TAHAP 1: EKSTRAKSI &amp; SINTESIS KONTEKS</span>
                    <span class="flow-stage-info">${Math.round(stage1Ms)}ms</span>
                </div>
                <div class="flow-stage-row">
            `;

            stage1Nodes.forEach((node, idx) => {
                html += renderCard(node, idx);
                if (idx < stage1Nodes.length - 1) {
                    const isConnActive = node.status === 'success';
                    html += renderArrow(isConnActive, stage1Chips[idx] || 'data');
                }
            });

            html += `
                </div>
                <div class="flow-bridge-row">
                    <div class="flow-bridge-track ${stage1Done ? 'active' : ''}">
                        <span>Kirim Prompt Terstruktur</span>
                        <div class="bridge-pulse-dot ${stage1Done ? 'pulsing' : ''}"></div>
                        <i class="ph ph-arrow-down-right"></i>
                        <span>Injeksi ke GPU Neural Engine</span>
                    </div>
                </div>
                <div class="flow-stage-bar">
                    <span class="flow-stage-label"><i class="ph ph-cpu"></i> TAHAP 2: INFERENSI NEURAL &amp; SANITASI OUTPUT</span>
                    <span class="flow-stage-info">${Math.round(stage2Ms)}ms</span>
                </div>
                <div class="flow-stage-row">
            `;

            stage2Nodes.forEach((node, idx) => {
                html += renderCard(node, idx + 4);
                if (idx < stage2Nodes.length - 1) {
                    const isConnActive = node.status === 'success';
                    html += renderArrow(isConnActive, stage2Chips[idx] || 'data');
                }
            });

            html += `</div>`;

            container.innerHTML = html;
            updateInspector();
        }

        // Select node
        function selectNode(nodeId) {
            selectedNodeId = nodeId;
            document.querySelectorAll('.flow-node-card').forEach(card => card.classList.remove('selected'));
            if (currentTrace) {
                renderWorkflow(currentTrace);
            }
        }

        // Switch Inspector Tab
        function switchInspectorTab(tab) {
            activeTab = tab;
            document.getElementById('tab-out-btn').classList.toggle('active', tab === 'output');
            document.getElementById('tab-in-btn').classList.toggle('active', tab === 'input');
            updateInspector();
        }

        // Update inspector view
        function updateInspector() {
            if (!currentTrace || !currentTrace.nodes) return;
            const node = currentTrace.nodes.find(n => n.id === selectedNodeId) || currentTrace.nodes[0];
            if (!node) return;

            document.getElementById('side-node-name').textContent = node.name;
            document.getElementById('side-node-summary').textContent = `${node.summary || ''} • Durasi: ${node.duration_ms || 0}ms`;

            const codeView = document.getElementById('side-code-view');
            const dataToView = activeTab === 'output' ? node.data_out : node.data_in;
            codeView.textContent = JSON.stringify(dataToView || {}, null, 2);
        }

        // Copy JSON
        function copyCurrentJson() {
            const code = document.getElementById('side-code-view').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert("JSON berhasil disalin ke clipboard!");
            });
        }

        // Test Query Runner
        async function runTestQuery(event) {
            event.preventDefault();
            const input = document.getElementById('test-input');
            const btn = document.getElementById('test-submit-btn');
            const query = input.value.trim();
            if (!query) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Berpikir...';
            startSim(query);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: query })
                });
                const data = await res.json();
                clearSim();
                if (data.pipeline_trace) {
                    currentTrace = data.pipeline_trace;
                    renderWorkflow(currentTrace);
                }
            } catch (err) {
                clearSim();
                console.error("Test execution error:", err);
            } finally {
                clearSim();
                btn.disabled = false;
                btn.innerHTML = '<i class="ph ph-play"></i> Eksekusi';
                input.value = '';
            }
        }

        // On page load
        window.addEventListener('DOMContentLoaded', () => {
            fetchLatestTrace();
            initSSE();
        });
    </script>
</body>
</html>
